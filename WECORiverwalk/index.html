<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Portions of the West Columbia/Cayce Riverwalk that are open or closed</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin:0; padding:0; }
    #map { position:absolute; top:0;bottom:0; width:100vw; height:100vh; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.1.3/dist/pmtiles.js"></script>
<script>
  // Register PMTiles protocol with MapLibre
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  // Adjust bounds/center/zoom for your city!
  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        "city-tiles": {
          type: "vector",
          url: "pmtiles://city.pmtiles"
        }
      },
      layers: [
        {
          id: "city-basemap",
          type: "line",
          source: "city-tiles",
          "source-layer": "basemap-riverwalk.pmtiles", // <-- Update this to the layer name within PMTiles!
          paint: {"line-color": "#0074D9", "line-width": 1}
        }
      ]
    },
    center: [33.994928, -81.052450], // [lng, lat], update to center of your city
    zoom: 12 // adjust as needed
  });

  // Add GeoJSON layer after map loads
  map.on("load", function() {
    map.addSource("city-geojson", {
      type: "geojson",
      data: "city.geojson"
    });
    map.addLayer({
      id: "city-geojson-layer",
      type: "fill",
      source: "city-geojson",
      paint: {"fill-color": "#FF851B", "fill-opacity": 0.3}
    });
    // Optionally add outline if GeoJSON is polygons:
    map.addLayer({
      id: "city-geojson-outline",
      type: "line",
      source: "city-geojson",
      paint: {"line-color": "#FF4136", "line-width": 2}
    });
  });
</script>

</body>
</html>
